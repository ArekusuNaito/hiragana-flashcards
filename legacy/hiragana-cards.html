<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hiragana Flashcards</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Noto Sans JP for accurate Japanese rendering -->
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Poppins:wght@400;600&display=swap"
        rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f3f4f6;
        }

        .japanese-font {
            font-family: 'Noto Sans JP', sans-serif;
        }

        /* Card Flip Animation (Optional for future, currently using fade) */
        .card-transition {
            transition: all 0.3s ease-in-out;
        }

        /* Custom Range Slider Styling */
        input[type=range] {
            -webkit-appearance: none;
            background: transparent;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 20px;
            width: 20px;
            border-radius: 50%;
            background: #4f46e5;
            cursor: pointer;
            margin-top: -8px;
        }

        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: #cbd5e1;
            border-radius: 2px;
        }

        .progress-bar {
            transition: width 0.1s linear;
        }
    </style>
</head>

<body class="min-h-screen flex flex-col items-center justify-center p-4 text-slate-800">

    <!-- Header -->
    <header class="mb-8 text-center">
        <h1 class="text-3xl font-bold text-indigo-600 mb-2">Hiragana Trainer</h1>
        <p class="text-sm text-slate-500">Flashcards (Tarjetas) & Slideshow (Presentación)</p>
    </header>

    <!-- Main Card Display -->
    <main class="w-full max-w-md relative">

        <!-- Timer Progress Bar -->
        <div class="absolute -top-2 left-0 w-full h-1 bg-gray-200 rounded-full overflow-hidden">
            <div id="timer-bar" class="h-full bg-indigo-500 w-0 progress-bar"></div>
        </div>

        <div id="card"
            class="bg-white rounded-2xl shadow-xl p-10 flex flex-col items-center justify-center aspect-[3/4] border border-slate-100 card-transition transform hover:scale-[1.01] transition-transform duration-300">

            <!-- Hiragana Character -->
            <div id="kana-display" class="japanese-font text-9xl font-bold text-slate-800 mb-6 select-none">
                あ
            </div>

            <!-- Romaji Display -->
            <div class="mt-4">
                <span id="romaji-display" class="text-2xl font-semibold text-slate-500 tracking-widest uppercase">
                    A
                </span>
            </div>

            <!-- Type Label (e.g., Vowel, K-Group) -->
            <div class="absolute top-4 right-4">
                <span id="group-display" class="text-xs font-mono text-slate-400 bg-slate-100 px-2 py-1 rounded">
                    Vowel
                </span>
            </div>
        </div>
    </main>

    <!-- Controls -->
    <section class="w-full max-w-md mt-8 space-y-6">

        <!-- Mode Toggles -->
        <div class="bg-white p-2 rounded-xl shadow-sm flex justify-between gap-2">
            <button onclick="setMode('linear')" id="btn-linear"
                class="flex-1 py-2 px-4 rounded-lg text-sm font-semibold bg-indigo-100 text-indigo-700 border border-indigo-200 transition-colors">
                Linear (Lineal)
            </button>
            <button onclick="setMode('random')" id="btn-random"
                class="flex-1 py-2 px-4 rounded-lg text-sm font-semibold bg-white text-slate-600 hover:bg-slate-50 transition-colors">
                Random (Aleatorio)
            </button>
        </div>

        <!-- Playback Controls -->
        <div class="bg-white p-4 rounded-xl shadow-sm space-y-4">

            <!-- Speed Slider -->
            <div class="flex items-center gap-4">
                <span class="text-xs font-bold text-slate-500 w-24">Speed (Velocidad):</span>
                <input type="range" id="speed-slider" min="1" max="10" value="3" step="0.5"
                    class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer">
                <span id="speed-value" class="text-xs font-mono w-12 text-right">3.0s</span>
            </div>

            <div class="flex justify-center items-center gap-6 pt-2">
                <!-- Prev Button -->
                <button onclick="prevCard()"
                    class="p-3 text-slate-400 hover:text-indigo-600 hover:bg-indigo-50 rounded-full transition-all"
                    title="Previous">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
                    </svg>
                </button>

                <!-- Play/Pause Toggle -->
                <button onclick="togglePlay()" id="play-btn"
                    class="p-4 bg-indigo-600 text-white rounded-full shadow-lg hover:bg-indigo-700 hover:shadow-indigo-200 transition-all transform hover:scale-105 active:scale-95">
                    <!-- Pause Icon (Default) -->
                    <svg id="icon-pause" xmlns="http://www.w3.org/2000/svg" class="h-10 w-10" viewBox="0 0 20 20"
                        fill="currentColor">
                        <path fill-rule="evenodd"
                            d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zM7 8a1 1 0 012 0v4a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v4a1 1 0 102 0V8a1 1 0 00-1-1z"
                            clip-rule="evenodd" />
                    </svg>
                    <!-- Play Icon (Hidden) -->
                    <svg id="icon-play" xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 hidden" viewBox="0 0 20 20"
                        fill="currentColor">
                        <path fill-rule="evenodd"
                            d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z"
                            clip-rule="evenodd" />
                    </svg>
                </button>

                <!-- Next Button -->
                <button onclick="nextCard()"
                    class="p-3 text-slate-400 hover:text-indigo-600 hover:bg-indigo-50 rounded-full transition-all"
                    title="Next">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                    </svg>
                </button>
            </div>
        </div>
    </section>

    <!-- Data & Logic -->
    <script>
        // --- DATASET ---
        const hiraganaData = [
            // Vowels
            { char: 'あ', romaji: 'a', group: 'Vowels' }, { char: 'い', romaji: 'i', group: 'Vowels' }, { char: 'う', romaji: 'u', group: 'Vowels' }, { char: 'え', romaji: 'e', group: 'Vowels' }, { char: 'お', romaji: 'o', group: 'Vowels' },
            // K
            { char: 'か', romaji: 'ka', group: 'K-Group' }, { char: 'き', romaji: 'ki', group: 'K-Group' }, { char: 'く', romaji: 'ku', group: 'K-Group' }, { char: 'け', romaji: 'ke', group: 'K-Group' }, { char: 'こ', romaji: 'ko', group: 'K-Group' },
            // S
            { char: 'さ', romaji: 'sa', group: 'S-Group' }, { char: 'し', romaji: 'shi', group: 'S-Group' }, { char: 'す', romaji: 'su', group: 'S-Group' }, { char: 'せ', romaji: 'se', group: 'S-Group' }, { char: 'そ', romaji: 'so', group: 'S-Group' },
            // T
            { char: 'た', romaji: 'ta', group: 'T-Group' }, { char: 'ち', romaji: 'chi', group: 'T-Group' }, { char: 'つ', romaji: 'tsu', group: 'T-Group' }, { char: 'て', romaji: 'te', group: 'T-Group' }, { char: 'と', romaji: 'to', group: 'T-Group' },
            // N
            { char: 'な', romaji: 'na', group: 'N-Group' }, { char: 'に', romaji: 'ni', group: 'N-Group' }, { char: 'ぬ', romaji: 'nu', group: 'N-Group' }, { char: 'ね', romaji: 'ne', group: 'N-Group' }, { char: 'の', romaji: 'no', group: 'N-Group' },
            // H
            { char: 'は', romaji: 'ha', group: 'H-Group' }, { char: 'ひ', romaji: 'hi', group: 'H-Group' }, { char: 'ふ', romaji: 'fu', group: 'H-Group' }, { char: 'へ', romaji: 'he', group: 'H-Group' }, { char: 'ほ', romaji: 'ho', group: 'H-Group' },
            // M
            { char: 'ま', romaji: 'ma', group: 'M-Group' }, { char: 'み', romaji: 'mi', group: 'M-Group' }, { char: 'む', romaji: 'mu', group: 'M-Group' }, { char: 'め', romaji: 'me', group: 'M-Group' }, { char: 'も', romaji: 'mo', group: 'M-Group' },
            // Y
            { char: 'や', romaji: 'ya', group: 'Y-Group' }, { char: 'ゆ', romaji: 'yu', group: 'Y-Group' }, { char: 'よ', romaji: 'yo', group: 'Y-Group' },
            // R
            { char: 'ら', romaji: 'ra', group: 'R-Group' }, { char: 'り', romaji: 'ri', group: 'R-Group' }, { char: 'る', romaji: 'ru', group: 'R-Group' }, { char: 'れ', romaji: 're', group: 'R-Group' }, { char: 'ろ', romaji: 'ro', group: 'R-Group' },
            // W / N
            { char: 'わ', romaji: 'wa', group: 'W-Group' }, { char: 'を', romaji: 'wo', group: 'W-Group' }, { char: 'ん', romaji: 'n', group: 'N-Group' },
            // G (Dakuten)
            { char: 'が', romaji: 'ga', group: 'G-Group' }, { char: 'ぎ', romaji: 'gi', group: 'G-Group' }, { char: 'ぐ', romaji: 'gu', group: 'G-Group' }, { char: 'げ', romaji: 'ge', group: 'G-Group' }, { char: 'ご', romaji: 'go', group: 'G-Group' },
            // Z (Dakuten)
            { char: 'ざ', romaji: 'za', group: 'Z-Group' }, { char: 'じ', romaji: 'ji', group: 'Z-Group' }, { char: 'ず', romaji: 'zu', group: 'Z-Group' }, { char: 'ぜ', romaji: 'ze', group: 'Z-Group' }, { char: 'ぞ', romaji: 'zo', group: 'Z-Group' },
            // D (Dakuten)
            { char: 'だ', romaji: 'da', group: 'D-Group' }, { char: 'ぢ', romaji: 'ji', group: 'D-Group' }, { char: 'づ', romaji: 'zu', group: 'D-Group' }, { char: 'で', romaji: 'de', group: 'D-Group' }, { char: 'ど', romaji: 'do', group: 'D-Group' },
            // B (Dakuten)
            { char: 'ば', romaji: 'ba', group: 'B-Group' }, { char: 'び', romaji: 'bi', group: 'B-Group' }, { char: 'ぶ', romaji: 'bu', group: 'B-Group' }, { char: 'べ', romaji: 'be', group: 'B-Group' }, { char: 'ぼ', romaji: 'bo', group: 'B-Group' },
            // P (Handakuten)
            { char: 'ぱ', romaji: 'pa', group: 'P-Group' }, { char: 'ぴ', romaji: 'pi', group: 'P-Group' }, { char: 'ぷ', romaji: 'pu', group: 'P-Group' }, { char: 'ぺ', romaji: 'pe', group: 'P-Group' }, { char: 'ぽ', romaji: 'po', group: 'P-Group' }
        ];

        // --- STATE VARIABLES ---
        let currentMode = 'linear'; // 'linear' or 'random'
        let currentList = [...hiraganaData];
        let currentIndex = 0;
        let isPlaying = true;
        let timerInterval = null;
        let speedSeconds = 3;
        let progressBarAnimation = null;

        // --- DOM ELEMENTS ---
        const ui = {
            kana: document.getElementById('kana-display'),
            romaji: document.getElementById('romaji-display'),
            group: document.getElementById('group-display'),
            btnLinear: document.getElementById('btn-linear'),
            btnRandom: document.getElementById('btn-random'),
            slider: document.getElementById('speed-slider'),
            speedVal: document.getElementById('speed-value'),
            playIcon: document.getElementById('icon-play'),
            pauseIcon: document.getElementById('icon-pause'),
            timerBar: document.getElementById('timer-bar'),
            card: document.getElementById('card')
        };

        // --- FUNCTIONS ---

        // Initialize
        function init() {
            renderCard();
            startTimer();
        }

        // Shuffle logic (Fisher-Yates)
        function shuffleArray(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex != 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        // Set Mode
        window.setMode = (mode) => {
            currentMode = mode;
            currentIndex = 0;

            // UI Toggle updates
            if (mode === 'linear') {
                currentList = [...hiraganaData];
                ui.btnLinear.classList.remove('bg-white', 'text-slate-600');
                ui.btnLinear.classList.add('bg-indigo-100', 'text-indigo-700', 'border-indigo-200');
                ui.btnRandom.classList.add('bg-white', 'text-slate-600');
                ui.btnRandom.classList.remove('bg-indigo-100', 'text-indigo-700', 'border-indigo-200');
            } else {
                currentList = shuffleArray([...hiraganaData]);
                ui.btnRandom.classList.remove('bg-white', 'text-slate-600');
                ui.btnRandom.classList.add('bg-indigo-100', 'text-indigo-700', 'border-indigo-200');
                ui.btnLinear.classList.add('bg-white', 'text-slate-600');
                ui.btnLinear.classList.remove('bg-indigo-100', 'text-indigo-700', 'border-indigo-200');
            }

            renderCard();
            resetTimer();
        };

        // Render current card
        function renderCard() {
            const item = currentList[currentIndex];

            // Animation reset
            ui.card.classList.remove('scale-100');
            ui.card.classList.add('scale-95', 'opacity-80');

            setTimeout(() => {
                ui.kana.textContent = item.char;
                ui.romaji.textContent = item.romaji;
                ui.group.textContent = item.group;

                ui.card.classList.remove('scale-95', 'opacity-80');
                ui.card.classList.add('scale-100', 'opacity-100');
            }, 100);
        }

        // Navigation
        window.nextCard = () => {
            currentIndex++;
            if (currentIndex >= currentList.length) {
                currentIndex = 0;
                // If random mode, re-shuffle on loop completion for variety
                if (currentMode === 'random') {
                    currentList = shuffleArray([...hiraganaData]);
                }
            }
            renderCard();
            resetTimer();
        };

        window.prevCard = () => {
            currentIndex--;
            if (currentIndex < 0) {
                currentIndex = currentList.length - 1;
            }
            renderCard();
            resetTimer();
        };

        // Playback Control
        window.togglePlay = () => {
            isPlaying = !isPlaying;
            if (isPlaying) {
                ui.playIcon.classList.add('hidden');
                ui.pauseIcon.classList.remove('hidden');
                startTimer();
            } else {
                ui.playIcon.classList.remove('hidden');
                ui.pauseIcon.classList.add('hidden');
                stopTimer();
            }
        };

        // Timer Logic
        function startTimer() {
            stopTimer(); // Clear existing
            if (!isPlaying) return;

            // CSS Animation for progress bar
            ui.timerBar.style.transition = 'none';
            ui.timerBar.style.width = '0%';

            // Force reflow
            void ui.timerBar.offsetWidth;

            ui.timerBar.style.transition = `width ${speedSeconds}s linear`;
            ui.timerBar.style.width = '100%';

            timerInterval = setTimeout(() => {
                nextCard();
            }, speedSeconds * 1000);
        }

        function stopTimer() {
            if (timerInterval) clearTimeout(timerInterval);
            // Pause visual bar
            const computedStyle = window.getComputedStyle(ui.timerBar);
            const width = computedStyle.getPropertyValue('width');
            ui.timerBar.style.transition = 'none';
            ui.timerBar.style.width = width;
        }

        function resetTimer() {
            if (isPlaying) startTimer();
        }

        // Slider Event
        ui.slider.addEventListener('input', (e) => {
            speedSeconds = parseFloat(e.target.value);
            ui.speedVal.textContent = speedSeconds.toFixed(1) + 's';
            resetTimer();
        });

        // Initialize App
        init();

    </script>
</body>

</html>
